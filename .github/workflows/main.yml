name: CI — Maven tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    name: Run mvnw tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      - name: Run unit tests
        run: ./mvnw -B test
